<!doctype html>
<html>
  <body style="margin: 0; padding: 0; background: #f1f3f3; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background: #f1f3f3; padding: 32px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background: #ffffff; border-radius: 8px; overflow: hidden;">
            <tr>
              <td style="padding: 24px 32px; border-bottom: 1px solid #e3e7e8;">
                <span style="font-size: 18px; font-weight: 700; color: #161b1d; letter-spacing: -0.02em;">{{.AppName}}</span>
              </td>
            </tr>
            <tr>
              <td style="padding: 32px; color: #161b1d; font-size: 14px; line-height: 1.6;">
                {{.Body}}
              </td>
            </tr>
            <tr>
              <td style="padding: 20px 32px; border-top: 1px solid #e3e7e8; color: #67787c; font-size: 12px;">
                Ini adalah pesan otomatis dari {{.AppName}}. Mohon untuk tidak membalas email ini secara langsung.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
