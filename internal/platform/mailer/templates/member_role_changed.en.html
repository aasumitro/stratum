<!-- subject: Your role in {{.OrganizationName}} has changed -->
<h2>Role Changed</h2>
<p>Hi,</p>
<p>Your role in <strong>{{.OrganizationName}}</strong> has been changed to <strong>{{.Role}}</strong>.</p>
<p><a href="{{.ActionURL}}" style="display: inline-block; padding: 12px 24px; background: #161b1d; color: #fff; text-decoration: none; border-radius: 6px;">Go to Organization</a></p>
<p style="color: #6b7280; font-size: 14px;">If you believe this was a mistake, please contact an admin of that organization.</p>
