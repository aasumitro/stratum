basePath: /api/v1
definitions:
  AddonInfo:
    properties:
      active:
        description: |-
          Active/CreatedAt round out the wire shape GET /references/addons
          has always returned.
        type: boolean
      created_at:
        type: string
      description:
        type: string
      features:
        additionalProperties:
          type: integer
        description: feature_id -> limit_value delta
        type: object
      id:
        type: string
      name:
        type: string
      prices:
        additionalProperties:
          $ref: '#/definitions/PlanPrices'
        type: object
    type: object
  EventRecord:
    properties:
      action:
        type: string
      actor:
        type: string
      created_at:
        type: string
      id:
        type: string
      ip:
        type: string
      metadata:
        items:
          type: integer
        type: array
      organization_id:
        type: string
      resource:
        type: string
      status_code:
        type: integer
      user_agent:
        type: string
    type: object
  FeatureInfo:
    properties:
      active:
        description: |-
          Active/CreatedAt round out the wire shape GET /references/features
          has always returned.
        type: boolean
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      metric_key:
        type: string
      name:
        type: string
      type:
        description: '"metered" | "boolean" | "static" | "config"'
        type: string
    type: object
  Payload:
    properties:
      data: {}
      next_cursor:
        type: string
      pagination:
        $ref: '#/definitions/pagination'
      status:
        $ref: '#/definitions/Status'
    type: object
  PlanInfo:
    properties:
      active:
        description: |-
          Active/CreatedAt/UpdatedAt round out the wire shape GET /references/plans
          has always returned; internal callers (rate-limit middleware, plan
          validation) don't use them.
        type: boolean
      config_values:
        additionalProperties:
          items:
            type: integer
          type: array
        description: |-
          ConfigValues holds the raw config_value JSON for this plan's
          type='config' features (billing.plan_features), keyed by feature ID —
          e.g. {"api_rate_limit": {"requests_per_minute": 300}}.
        type: object
      created_at:
        type: string
      description:
        type: string
      features:
        items:
          type: string
        type: array
      id:
        type: string
      limits:
        additionalProperties:
          type: integer
        type: object
      name:
        type: string
      prices:
        additionalProperties:
          $ref: '#/definitions/PlanPrices'
        type: object
      sort_order:
        description: |-
          SortOrder mirrors billing.plans.sort_order — the tier ranking used to
          detect upgrade vs downgrade, replacing a hardcoded plan-slug map.
        type: integer
      updated_at:
        type: string
    type: object
  PlanPrices:
    properties:
      monthly:
        type: integer
      yearly:
        type: integer
    type: object
  Status:
    properties:
      code:
        type: string
      details: {}
      error:
        type: boolean
      message:
        type: string
      request_id:
        type: string
    type: object
  acceptInvitationRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  addMemberRequest:
    properties:
      auth_sub:
        type: string
      role:
        enum:
        - admin
        - member
        type: string
    required:
    - auth_sub
    - role
    type: object
  attachAddonRequest:
    properties:
      addon_id:
        type: string
      quantity:
        minimum: 1
        type: integer
    required:
    - addon_id
    type: object
  attachedAddonRecord:
    properties:
      addon_id:
        type: string
      name:
        type: string
      prices:
        additionalProperties:
          $ref: '#/definitions/PlanPrices'
        type: object
      quantity:
        type: integer
    type: object
  bulkDeleteFilesRequest:
    properties:
      file_ids:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - file_ids
    type: object
  changePlanRequest:
    properties:
      cycle:
        enum:
        - monthly
        - yearly
        type: string
      plan:
        description: |-
          Plan is validated dynamically against billing.plans via the catalog
          lookup in changePlan — no oneof here: a static enum would reject any plan an
          operator adds through Studio's catalog composition UI that isn't one
          of the 3 originally-seeded slugs.
        type: string
    required:
    - cycle
    - plan
    type: object
  countryRecord:
    properties:
      active:
        type: boolean
      code:
        type: string
      created_at:
        type: string
      currency_code:
        type: string
      name:
        type: string
      phone_code:
        type: string
    type: object
  couponRecord:
    properties:
      active:
        type: boolean
      amount_cents:
        type: integer
      cadence:
        type: string
      code:
        type: string
      currency:
        type: string
      discount_type:
        type: string
      duration_count:
        type: integer
      max_redemptions:
        type: integer
      name:
        type: string
      percent_off:
        type: integer
      redeemed_count:
        type: integer
      valid_from:
        type: string
      valid_until:
        type: string
    type: object
  createFolderRequest:
    properties:
      name:
        maxLength: 255
        minLength: 1
        type: string
      parent_folder_id:
        type: string
    required:
    - name
    type: object
  createInvitationRequest:
    properties:
      email:
        type: string
      role:
        enum:
        - admin
        - member
        type: string
    required:
    - email
    - role
    type: object
  createOrganizationAddonRequest:
    properties:
      addon_id:
        type: string
      quantity:
        minimum: 1
        type: integer
    required:
    - addon_id
    type: object
  createOrganizationRequest:
    properties:
      addons:
        description: |-
          Addons and CouponCode are both optional — the "cart" the caller can
          build alongside plan/cycle so the org's first invoice (or, for a
          trial, the invoice cut at trial-end) already includes them instead of
          requiring separate attach/redeem calls raced against async
          provisioning. Both are validated against the live billing catalog
          before the organization is written, same as Plan.
        items:
          $ref: '#/definitions/createOrganizationAddonRequest'
        type: array
      country_code:
        type: string
      coupon_code:
        maxLength: 64
        type: string
      cycle:
        description: Cycle is required, same reasoning as Plan above — no silent default.
        enum:
        - monthly
        - yearly
        type: string
      name:
        maxLength: 100
        minLength: 1
        type: string
      plan:
        description: |-
          Plan is required and validated dynamically against the billing
          catalog (service.createOrganization, via refReader.GetPlanByID) —
          no oneof here, same reasoning as billing.changePlanRequest.Plan: a
          static enum would reject any plan an operator adds through Studio.
          The caller must always choose one explicitly — no silent default.
        maxLength: 64
        type: string
      slug:
        maxLength: 63
        minLength: 1
        type: string
    required:
    - cycle
    - name
    - plan
    - slug
    type: object
  createWebhookRequest:
    properties:
      subscribed_events:
        items:
          type: string
        type: array
      url:
        type: string
    required:
    - url
    type: object
  currencyRecord:
    properties:
      active:
        type: boolean
      code:
        type: string
      created_at:
        type: string
      decimal_places:
        type: integer
      name:
        type: string
      symbol:
        type: string
    type: object
  declineInvitationRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  entitlementRecord:
    properties:
      addon_delta:
        description: metered only; sum of attached-addon deltas ("6/8 · 3 plan + 5
          addon")
        type: integer
      config_value:
        description: config only
        items:
          type: integer
        type: array
      current:
        description: metered only
        type: integer
      feature_id:
        type: string
      limit:
        description: metered only; -1 = unlimited; PlanLimit + AddonDelta
        type: integer
      name:
        type: string
      plan_limit:
        description: metered only; the plan's own limit before addons
        type: integer
      remaining:
        description: metered only; -1 = unlimited
        type: integer
      type:
        type: string
    type: object
  extendSubscriptionRequest:
    properties:
      months:
        maximum: 24
        minimum: 1
        type: integer
    required:
    - months
    type: object
  fileRecord:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      deleted_at:
        type: string
      folder_id:
        type: string
      id:
        type: string
      mime_type:
        type: string
      name:
        type: string
      organization_id:
        type: string
      path:
        type: string
      size_bytes:
        type: integer
    type: object
  folderRecord:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      id:
        type: string
      name:
        type: string
      organization_id:
        type: string
      parent_folder_id:
        type: string
      updated_at:
        type: string
    type: object
  historyView:
    properties:
      action:
        type: string
      amount_cents:
        type: integer
      changed_at:
        type: string
      changed_by:
        type: string
      changed_by_kind:
        description: '"user" | "system" | "webhook"'
        type: string
      changed_by_name:
        type: string
      currency:
        type: string
      from_plan:
        type: string
      id:
        type: string
      metadata:
        items:
          type: integer
        type: array
      subscription_id:
        type: string
      to_plan:
        type: string
    type: object
  importMembersRequest:
    properties:
      dry_run:
        type: boolean
      rows:
        items:
          $ref: '#/definitions/importRowRaw'
        maxItems: 200
        type: array
    required:
    - rows
    type: object
  importRowRaw:
    properties:
      email:
        type: string
      role:
        type: string
    type: object
  importRowResult:
    properties:
      email:
        type: string
      index:
        type: integer
      reason:
        type: string
    type: object
  invitationPreview:
    properties:
      invitedByEmail:
        type: string
      invitedEmail:
        description: |-
          InvitedEmail is only populated on an ErrInvitationEmailMismatch
          return — the address the invitation actually targets.
        type: string
      organizationID:
        type: string
      organizationName:
        type: string
      role:
        type: string
    type: object
  invitationRecord:
    properties:
      created_at:
        type: string
      email:
        type: string
      expires_at:
        type: string
      id:
        type: string
      invited_by:
        type: string
      organization_id:
        type: string
      role:
        type: string
      status:
        type: string
    type: object
  inviteCodePreview:
    properties:
      organization_id:
        type: string
      organization_name:
        type: string
      owner_avatar_url:
        type: string
      owner_email:
        type: string
      owner_name:
        type: string
    type: object
  invoicePreview:
    properties:
      addon_lines:
        items:
          $ref: '#/definitions/lineItemSpec'
        type: array
      coupon_code:
        type: string
      currency:
        type: string
      cycle:
        type: string
      discount_cents:
        type: integer
      new_period_end:
        description: |-
          NewPeriodEnd is only set when plan/cycle differ from the subscription's
          current plan/cycle — a hypothetical-change preview, not the steady-state one.
        type: string
      plan:
        type: string
      plan_line_cents:
        type: integer
      total_cents:
        type: integer
    type: object
  invoiceRecord:
    properties:
      amount_cents:
        type: integer
      created_at:
        type: string
      currency:
        type: string
      due_at:
        type: string
      id:
        type: string
      invoice_number:
        type: string
      paid_at:
        type: string
      provider_invoice_id:
        type: string
      status:
        type: string
      subscription_id:
        type: string
      subtotal_cents:
        type: integer
      tax_cents:
        type: integer
      tax_rate_bps:
        type: integer
      updated_at:
        type: string
    type: object
  joinByCodeRequest:
    properties:
      code:
        type: string
    required:
    - code
    type: object
  lineItemSpec:
    properties:
      description:
        type: string
      quantity:
        type: integer
      total_cents:
        type: integer
      unit_price_cents:
        type: integer
    type: object
  loginEventRecord:
    properties:
      auth_sub:
        type: string
      created_at:
        type: string
      id:
        type: string
      ip_address:
        type: string
      user_agent:
        type: string
    type: object
  memberView:
    properties:
      auth_sub:
        type: string
      avatar_url:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: string
      joined_at:
        type: string
      organization_id:
        type: string
      role:
        type: string
    type: object
  membershipRecord:
    properties:
      auth_sub:
        type: string
      id:
        type: string
      joined_at:
        type: string
      organization_id:
        type: string
      role:
        type: string
    type: object
  messageRecord:
    properties:
      auth_sub:
        type: string
      body:
        type: string
      channel:
        type: string
      created_at:
        type: string
      id:
        type: string
      kind:
        type: string
      organization_id:
        type: string
      payload:
        items:
          type: integer
        type: array
      read_at:
        type: string
      sent_at:
        type: string
      status:
        type: string
      subject:
        type: string
      updated_at:
        type: string
    type: object
  moveFileRequest:
    properties:
      folder_id:
        type: string
    type: object
  myInvitationRecord:
    properties:
      created_at:
        type: string
      email:
        type: string
      expires_at:
        type: string
      id:
        type: string
      invited_by:
        type: string
      invited_by_email:
        type: string
      organization_id:
        type: string
      organization_name:
        type: string
      role:
        type: string
      token:
        description: |-
          Token IS exposed here (unlike the admin-facing invitationRecord,
          which keeps json:"-") so the caller's own onboarding screen can
          one-click POST /invitations/accept without a redirect — this
          endpoint is already scoped to the authenticated caller's own email,
          the same audience the token was already emailed to.
        type: string
    type: object
  organizationRecord:
    properties:
      country_code:
        type: string
      created_at:
        type: string
      id:
        type: string
      invite_code:
        type: string
      invite_code_enabled:
        type: boolean
      locale:
        type: string
      name:
        type: string
      owner_id:
        type: string
      settings:
        items:
          type: integer
        type: array
      slug:
        type: string
      status:
        type: string
      suspended_at:
        type: string
      suspended_reason:
        type: string
      timezone:
        type: string
      updated_at:
        type: string
    type: object
  organizationView:
    properties:
      created_at:
        type: string
      id:
        type: string
      joined_at:
        type: string
      name:
        type: string
      owner_id:
        type: string
      role:
        type: string
      slug:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  pagination:
    properties:
      current_page:
        type: integer
      limit:
        type: integer
      offset:
        type: integer
      total_items:
        type: integer
      total_pages:
        type: integer
    type: object
  paymentLinkRecord:
    properties:
      amount_cents:
        type: integer
      created_at:
        type: string
      currency:
        type: string
      expires_at:
        type: string
      external_id:
        type: string
      id:
        type: string
      invoice_id:
        type: string
      provider:
        type: string
      status:
        type: string
      url:
        type: string
    type: object
  paymentRecord:
    properties:
      amount_cents:
        type: integer
      created_at:
        type: string
      currency:
        type: string
      external_id:
        type: string
      id:
        type: string
      invoice_id:
        type: string
      paid_at:
        type: string
      provider:
        type: string
      status:
        type: string
    type: object
  preferenceRecord:
    properties:
      channel:
        type: string
      created_at:
        type: string
      enabled:
        type: boolean
      event_type:
        type: string
      id:
        type: string
      updated_at:
        type: string
    type: object
  recordUsageRequest:
    properties:
      metric:
        type: string
      value:
        minimum: 1
        type: integer
    required:
    - metric
    - value
    type: object
  redeemCouponRequest:
    properties:
      code:
        type: string
    required:
    - code
    type: object
  requestNewInvitationRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  safeEndpoint:
    properties:
      auto_disabled_at:
        type: string
      created_at: {}
      enabled:
        type: boolean
      health:
        $ref: '#/definitions/webhookHealthDTO'
      id:
        type: string
      secret_rotation_expires_at:
        type: string
      subscribed_events:
        items:
          type: string
        type: array
      updated_at: {}
      url:
        type: string
    type: object
  subscriptionRecord:
    properties:
      created_at:
        type: string
      currency:
        type: string
      cycle:
        type: string
      id:
        type: string
      period_end:
        type: string
      period_start:
        type: string
      plan:
        type: string
      status:
        type: string
      subject_id:
        type: string
      subject_type:
        type: string
      trial_end:
        type: string
      updated_at:
        type: string
    type: object
  subscriptionWithCoupon:
    properties:
      active_coupon:
        type: string
      created_at:
        type: string
      currency:
        type: string
      cycle:
        type: string
      id:
        type: string
      period_end:
        type: string
      period_start:
        type: string
      plan:
        type: string
      status:
        type: string
      subject_id:
        type: string
      subject_type:
        type: string
      trial_end:
        type: string
      updated_at:
        type: string
    type: object
  supabaseUserWebhookPayload:
    properties:
      old_record:
        properties:
          email:
            type: string
        type: object
      record:
        properties:
          email:
            type: string
          id:
            description: auth.users.id — matches account.users.auth_sub
            type: string
        type: object
      table:
        type: string
    type: object
  suspendOrganizationRequest:
    properties:
      reason:
        maxLength: 500
        type: string
    type: object
  taskRecord:
    properties:
      auth_sub:
        type: string
      completed_at:
        type: string
      created_at:
        type: string
      error:
        type: string
      id:
        type: string
      kind:
        type: string
      result:
        items:
          type: integer
        type: array
      status:
        type: string
    type: object
  toggleInviteCodeRequest:
    properties:
      enabled:
        type: boolean
    type: object
  transferOwnershipRequest:
    properties:
      auth_sub:
        type: string
    required:
    - auth_sub
    type: object
  updateFolderRequest:
    properties:
      name:
        type: string
      parent_folder_id:
        description: |-
          ParentFolderID is only applied when explicitly present in the JSON
          body — moveToParent distinguishes "move to root" (field present,
          null) from "don't touch the parent" (field absent entirely).
        type: string
    type: object
  updateMemberRoleRequest:
    properties:
      role:
        enum:
        - admin
        - member
        type: string
    required:
    - role
    type: object
  updateOrganizationRequest:
    properties:
      name:
        maxLength: 100
        minLength: 1
        type: string
      slug:
        maxLength: 63
        minLength: 1
        type: string
    type: object
  updateProfileRequest:
    properties:
      avatar_url:
        maxLength: 2048
        type: string
      full_name:
        maxLength: 255
        type: string
    type: object
  updateSettingsRequest:
    properties:
      allowed_ips:
        items:
          type: string
        type: array
      locale:
        type: string
      timezone:
        type: string
    required:
    - locale
    - timezone
    type: object
  updateWebhookRequest:
    properties:
      enabled:
        type: boolean
      subscribed_events:
        items:
          type: string
        type: array
      url:
        type: string
    required:
    - url
    type: object
  upsertPrefRequest:
    properties:
      channel:
        type: string
      enabled:
        type: boolean
      event_type:
        type: string
    required:
    - channel
    - event_type
    type: object
  upsertProfileRequest:
    properties:
      avatar_url:
        maxLength: 2048
        type: string
      full_name:
        maxLength: 255
        type: string
    type: object
  usageRecord:
    properties:
      id:
        type: string
      metric:
        type: string
      organization_id:
        type: string
      period_end:
        type: string
      period_start:
        type: string
      recorded_at:
        type: string
      value:
        type: integer
    type: object
  userRecord:
    properties:
      auth_sub:
        type: string
      avatar_url:
        type: string
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: string
      preferences:
        items:
          type: integer
        type: array
      updated_at:
        type: string
    type: object
  webhookDeliveryRecord:
    properties:
      attempts:
        type: integer
      attempts_log:
        items:
          type: integer
        type: array
      created_at:
        type: string
      delivered_at:
        type: string
      endpoint_id:
        type: string
      event_id:
        type: string
      event_type:
        type: string
      id:
        type: string
      last_error:
        type: string
      latency_ms:
        type: integer
      response_body:
        type: string
      response_status_code:
        type: integer
      status:
        type: string
    type: object
  webhookHealthDTO:
    properties:
      delivered_24h:
        type: integer
      success_percent_24h:
        type: integer
      total_24h:
        type: integer
    type: object
info:
  contact: {}
  description: REST API for Stratum — organizations, accounts, billing, and notifications.
  title: Stratum API
  version: "1.0"
paths:
  /billing/coupons/eligible:
    get:
      description: Same eligibility rules as the per-organization list, minus org-targeted
        coupons (there is no organization yet) — for the "create organization" cart.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/Payload'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/couponRecord'
                  type: array
              type: object
        "401":
          description: missing/invalid auth token
          schema:
            $ref: '#/definitions/Payload'
      security:
      - BearerAuth: []
