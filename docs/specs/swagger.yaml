          description: owner role required
          schema:
            $ref: '#/definitions/Payload'
        "422":
          description: validation failed
          schema:
            $ref: '#/definitions/Payload'
      security:
      - BearerAuth: []
      summary: Update a webhook endpoint
      tags:
      - organization
  /organizations/{organizationID}/webhooks/{webhookID}/deliveries:
    get:
      description: Cursor-paginated delivery attempts for an endpoint, optionally
        filtered. Owner only.
      parameters:
      - description: Organization ID
        in: path
        name: organizationID
        required: true
        type: string
      - description: Webhook ID
        in: path
        name: webhookID
        required: true
        type: string
      - description: max results (default 20, max 100)
        in: query
        name: limit
        type: integer
      - description: pagination cursor from a previous response
        in: query
        name: cursor
        type: string
      - description: filter by delivery status
        in: query
        name: status
        type: string
      - description: filter by event type
        in: query
        name: event_type
        type: string
      - description: RFC3339 lower bound on created_at
        in: query
        name: since
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/Payload'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/webhookDeliveryRecord'
                  type: array
              type: object
        "401":
          description: missing/invalid auth token
          schema:
            $ref: '#/definitions/Payload'
        "403":
          description: owner role required
          schema:
            $ref: '#/definitions/Payload'
        "404":
          description: webhook not found
          schema:
            $ref: '#/definitions/Payload'
      security:
      - BearerAuth: []
      summary: List webhook deliveries
      tags:
      - organization
  /organizations/{organizationID}/webhooks/{webhookID}/deliveries/{deliveryID}/retry:
    post:
      parameters:
      - description: Organization ID
        in: path
        name: organizationID
        required: true
        type: string
      - description: Webhook ID
        in: path
        name: webhookID
        required: true
        type: string
      - description: Delivery ID
        in: path
        name: deliveryID
        required: true
        type: string
      responses:
        "204":
          description: no content
        "401":
          description: missing/invalid auth token
          schema:
            $ref: '#/definitions/Payload'
        "403":
          description: owner role required
          schema:
            $ref: '#/definitions/Payload'
      security:
      - BearerAuth: []
      summary: Retry a single webhook delivery
      tags:
      - organization
  /organizations/{organizationID}/webhooks/{webhookID}/deliveries/retry-failed:
    post:
      description: Queues up to the 50 most recent failed deliveries for this endpoint
        to be retried asynchronously — the returned count is how many were queued,
        not how many ultimately succeed.
      parameters:
      - description: Organization ID
        in: path
        name: organizationID
        required: true
        type: string
      - description: Webhook ID
        in: path
        name: webhookID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/Payload'
            - properties:
                data:
                  properties:
                    retried:
                      type: integer
                  type: object
              type: object
        "401":
          description: missing/invalid auth token
          schema:
            $ref: '#/definitions/Payload'
        "403":
          description: owner role required
          schema:
            $ref: '#/definitions/Payload'
      security:
      - BearerAuth: []
      summary: Retry all failed webhook deliveries
      tags:
      - organization
  /organizations/{organizationID}/webhooks/{webhookID}/rotate-secret:
    post:
      description: Owner only. The new secret is returned once, in this response only.
      parameters:
      - description: Organization ID
        in: path
        name: organizationID
        required: true
        type: string
      - description: Webhook ID
        in: path
        name: webhookID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/Payload'
            - properties:
                data:
                  properties:
                    id:
                      type: string
                    secret:
                      type: string
                    secret_rotation_expires_at:
                      type: string
                  type: object
              type: object
        "401":
          description: missing/invalid auth token
          schema:
            $ref: '#/definitions/Payload'
        "403":
          description: owner role required
          schema:
            $ref: '#/definitions/Payload'
      security:
      - BearerAuth: []
      summary: Rotate a webhook's signing secret
      tags:
      - organization
  /organizations/{organizationID}/webhooks/{webhookID}/test-event:
    post:
      description: Owner only. Fires a synthetic delivery to verify the endpoint is
        reachable and correctly signed.
      parameters:
      - description: Organization ID
        in: path
        name: organizationID
        required: true
        type: string
      - description: Webhook ID
        in: path
        name: webhookID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/Payload'
            - properties:
                data:
                  properties:
                    delivery:
                      $ref: '#/definitions/webhookDeliveryRecord'
                    success:
                      type: boolean
                  type: object
              type: object
        "401":
          description: missing/invalid auth token
          schema:
            $ref: '#/definitions/Payload'
        "403":
          description: owner role required
          schema:
            $ref: '#/definitions/Payload'
      security:
      - BearerAuth: []
      summary: Send a test event
      tags:
      - organization
  /organizations/join:
    post:
      consumes:
      - application/json
      parameters:
      - description: Invite code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/joinByCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/Payload'
            - properties:
                data:
                  $ref: '#/definitions/organizationRecord'
              type: object
        "401":
          description: missing/invalid auth token
          schema:
            $ref: '#/definitions/Payload'
        "422":
          description: validation failed, invalid code, invite code disabled, already
            a member, or plan limit reached
          schema:
            $ref: '#/definitions/Payload'
      security:
      - BearerAuth: []
      summary: Join an organization by invite code
      tags:
      - organization
  /organizations/join/preview:
    get:
      description: Read-only organization + owner details for a code, before committing
        to join.
      parameters:
      - description: Invite code
        in: query
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/Payload'
            - properties:
                data:
                  $ref: '#/definitions/inviteCodePreview'
              type: object
        "401":
          description: missing/invalid auth token
          schema:
            $ref: '#/definitions/Payload'
        "422":
          description: missing code, invalid code, invite code disabled, or already
            a member
          schema:
            $ref: '#/definitions/Payload'
      security:
      - BearerAuth: []
      summary: Preview an organization by invite code
      tags:
      - organization
  /references/addons:
    get:
      description: Returns the billing addon catalog; delegated to the billing module's
        catalog reader. Pass country_code to scope each addon's prices down to the
        currency that country is actually billed in — omit it to get every currency.
      parameters:
      - description: ISO country code — scopes prices to that country's currency
        in: query
        name: country_code
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/Payload'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/AddonInfo'
                  type: array
              type: object
        "401":
          description: missing/invalid auth token
          schema:
            $ref: '#/definitions/Payload'
      security:
      - BearerAuth: []
      summary: List billing addons
      tags:
      - reference
  /references/countries:
    get:
      description: Returns the static reference list of countries.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/Payload'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/countryRecord'
                  type: array
              type: object
        "401":
          description: missing/invalid auth token
          schema:
            $ref: '#/definitions/Payload'
      security:
      - BearerAuth: []
      summary: List countries
      tags:
      - reference
  /references/currencies:
    get:
      description: Returns the static reference list of currencies.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/Payload'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/currencyRecord'
                  type: array
              type: object
        "401":
          description: missing/invalid auth token
          schema:
            $ref: '#/definitions/Payload'
      security:
      - BearerAuth: []
      summary: List currencies
      tags:
      - reference
  /references/features:
    get:
      description: Returns the billing feature catalog; delegated to the billing module's
        catalog reader.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/Payload'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/FeatureInfo'
                  type: array
              type: object
        "401":
          description: missing/invalid auth token
          schema:
            $ref: '#/definitions/Payload'
      security:
      - BearerAuth: []
      summary: List billing features
      tags:
      - reference
  /references/plans:
    get:
      description: Returns the billing plan catalog (pricing, limits, features); delegated
        to the billing module's catalog reader. Pass country_code to scope each plan's
        prices down to the currency that country is actually billed in — omit it to
        get every currency.
      parameters:
      - description: ISO country code — scopes prices to that country's currency
        in: query
        name: country_code
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/Payload'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/PlanInfo'
                  type: array
              type: object
        "401":
          description: missing/invalid auth token
          schema:
            $ref: '#/definitions/Payload'
      security:
      - BearerAuth: []
      summary: List billing plans
      tags:
      - reference
  /webhooks/stripe:
    post:
      consumes:
      - application/json
      description: Public webhook receiving Stripe Checkout Session and payment_intent
        events. Verified via HMAC-SHA256 Stripe-Signature header, not bearer auth.
        Non-relevant event types are ACK'd 200 to stop retries.
      parameters:
      - description: HMAC-SHA256 signature (t=,v1=)
        in: header
        name: Stripe-Signature
        required: true
        type: string
      - description: Stripe event payload
        in: body
        name: body
        required: true
        schema:
          type: object
      responses:
        "200":
          description: ok (processed or ACK'd)
        "400":
          description: invalid body or payload
          schema:
            $ref: '#/definitions/Payload'
        "401":
          description: invalid signature
          schema:
            $ref: '#/definitions/Payload'
      summary: Stripe webhook
      tags:
      - webhooks
  /webhooks/supabase/user-updated:
    post:
      consumes:
      - application/json
      description: 'Internal webhook: syncs account.users.email after Supabase''s
        own Secure Email Change flow commits a change. Verified via X-Webhook-Secret,
        not bearer auth.'
      parameters:
      - description: Shared webhook secret
        in: header
        name: X-Webhook-Secret
        required: true
        type: string
      - description: Supabase database webhook payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/supabaseUserWebhookPayload'
      responses:
        "200":
          description: ok
        "400":
          description: invalid payload
          schema:
            $ref: '#/definitions/Payload'
        "401":
          description: invalid webhook secret
          schema:
            $ref: '#/definitions/Payload'
      summary: Supabase user-updated webhook
      tags:
      - webhooks
  /webhooks/xendit:
    post:
      consumes:
      - application/json
      description: Public webhook receiving Xendit payment callbacks. Verified via
        x-callback-token header, not bearer auth.
      parameters:
      - description: Shared callback token
        in: header
        name: x-callback-token
        required: true
        type: string
      - description: Xendit callback payload
        in: body
        name: body
        required: true
        schema:
          type: object
      responses:
        "200":
          description: ok (processed or ACK'd)
        "400":
          description: invalid payload
          schema:
            $ref: '#/definitions/Payload'
        "401":
          description: invalid token
          schema:
            $ref: '#/definitions/Payload'
      summary: Xendit webhook
      tags:
      - webhooks
securityDefinitions:
  BearerAuth:
    description: Bearer token issued by Supabase auth.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
