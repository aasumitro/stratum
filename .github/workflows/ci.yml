name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

# Cancel in-flight runs on the same PR when a new push arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Changes — decide which jobs actually need to run
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      studio: ${{ steps.filter.outputs.studio }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A pull request diffs against its base branch. A push diffs against the previous tip, unless
      # that tip is all zeros (a new branch) or no longer reachable (a force-push): with nothing to
      # compare to, every surface counts as changed.
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF" --depth=1
            changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
          elif git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE_SHA...$GITHUB_SHA")
          else
            changed=$(printf 'go.mod\nui/app/\nui/studio/\n')
          fi
          echo "$changed"
          echo "api=$(grep -qE '^(db/|internal/|cmd/|deploy/postgres-init/|go\.(mod|sum))' <<<"$changed" && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "web=$(grep -q '^ui/app/' <<<"$changed" && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "studio=$(grep -q '^ui/studio/' <<<"$changed" && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Secrets — runs on every event, because any file can carry a credential
  # ---------------------------------------------------------------------------
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Scan git history
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          gitleaks git --redact --no-banner .

  # ---------------------------------------------------------------------------
  # API — Go backend
  # ---------------------------------------------------------------------------
  api:
    name: API
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: stratum
          POSTGRES_PASSWORD: stratum
          POSTGRES_DB: stratum
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:4.3-alpine
        # The broker's default guest user only accepts loopback connections, which a mapped port
        # is not.
        env:
          RABBITMQ_DEFAULT_USER: stratum
          RABBITMQ_DEFAULT_PASS: stratum
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Format
        run: gofmt -w .

      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          golangci-lint run ./...

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

      - name: Install migrate
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.20.1

      # Migrations 000008/000009/000011 do not create the stratum_app/stratum_worker/stratum_webhook/
      # stratum_app_unscoped/stratum_operator roles — they only grant privileges to them, assuming they already exist, so the
      # migrator role never needs BYPASSRLS or CREATEROLE itself. Local dev gets this for
      # free via a Postgres init script mounted into its container;
      # CI's Postgres service has no equivalent mount, so this step reuses that same script
      # explicitly, before migrations run. Fixed, non-secret passwords (matching the
      # stratum/stratum owner credential already hardcoded below) are fine — this Postgres
      # instance is created fresh and destroyed at the end of every run.
      - name: Provision runtime roles
        env:
          DATABASE_URL: postgres://stratum:stratum@localhost:5432/stratum?sslmode=disable
        run: |
          psql "$DATABASE_URL" -f deploy/postgres-init/01-app-role.sql
          psql "$DATABASE_URL" -f deploy/postgres-init/02-test-role.sql
          psql "$DATABASE_URL" -f deploy/postgres-init/03-operator-role.sql

      - name: Run migrations
        env:
          DATABASE_URL: postgres://stratum:stratum@localhost:5432/stratum?sslmode=disable
        run: migrate -path db/migrations -database "$DATABASE_URL" up

      - name: Test
        env:
          TEST_DATABASE_URL: postgres://stratum_test:stratum_test@localhost:5432/stratum?sslmode=disable
          POSTGRES_APP_URL: postgres://stratum_app:stratum_app@localhost:5432/stratum?sslmode=disable
          POSTGRES_WORKER_URL: postgres://stratum_worker:stratum_worker@localhost:5432/stratum?sslmode=disable
          POSTGRES_WEBHOOK_URL: postgres://stratum_webhook:stratum_webhook@localhost:5432/stratum?sslmode=disable
          POSTGRES_UNSCOPED_URL: postgres://stratum_app_unscoped:stratum_app_unscoped@localhost:5432/stratum?sslmode=disable
          POSTGRES_OPERATOR_URL: postgres://stratum_operator_dev:stratum_operator_dev@localhost:5432/stratum?sslmode=disable
          RABBITMQ_URL: amqp://stratum:stratum@localhost:5672/
          TEST_REDIS_URL: redis://localhost:6379
        run: go test ./... -race -count=1 -timeout 120s -coverprofile=coverage.out -covermode=atomic

      - name: Coverage
        run: go tool cover -func=coverage.out

  # ---------------------------------------------------------------------------
  # Web — React frontend
  # ---------------------------------------------------------------------------
  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/app

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "25"
          cache: npm
          cache-dependency-path: ui/app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npx prettier --check "**/*.{ts,tsx}"

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high

  # ---------------------------------------------------------------------------
  # Studio — Desktop (Wails) Go backend & React frontend
  # ---------------------------------------------------------------------------
  studio:
    name: Studio
    needs: changes
    if: needs.changes.outputs.studio == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/studio

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: ui/studio/go.mod
          cache-dependency-path: ui/studio/go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: "25"
          cache: npm
          cache-dependency-path: ui/studio/frontend/package-lock.json

      # Wails v3 links against GTK4/WebKitGTK 6.0 on Linux — required for `go build`/`go vet`.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Lint frontend
        run: cd frontend && npm run lint

      - name: Format check frontend
        run: cd frontend && npx prettier --check "**/*.{ts,tsx}"

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Dependency audit
        run: cd frontend && npm audit --audit-level=high

      - name: Verify modules
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Format
        run: gofmt -w .

      - name: Build
        run: go build ./...

      # The keychain is an in-memory fake in tests. The operator smoke test needs a live database
      # and broker and skips without them; the operator guard only reads source, and is what stops
      # a new mutating method from skipping operator attribution.
      - name: Test
        run: go test ./...